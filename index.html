<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityDex</title>
    <script>
        try {
            const temaGuardado = localStorage.getItem('tema');
            if (temaGuardado === 'dark' || temaGuardado === 'light') {
                document.documentElement.classList.add(temaGuardado);
            }
        } catch (error) {

        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <img src="assets/InfinityDex.webp" alt="InfinityDex" height="64" width="76">
        <h1>InfinityDex</h1>
        <button type="button" class="toggle-tema" aria-label="Modo oscuro" aria-pressed="false">
            <span class="toggle-bola">
                <svg viewbox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                    <mask id="mascara-luna">
                        <rect x="-10" y="-10" width="44" height="44" fill="#fff" />
                        <circle class="luna-mordida" cx="16" cy="8" r="7" fill="#000" />
                    </mask>
                    <g class="sol-rayos">
                        <path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M4.6 19.4L6 18M18 6l1.4-1.4" />
                    </g>
                    <circle class="sol-cuerpo" cx="12" cy="12" r="6" mask="url(#mascara-luna)" />
                </svg>
            </span>
        </button>
    </header>

    <div class="controls">
        <button class="icon-btn" aria-label="Búsqueda" aria-expanded="false" aria-controls="panel-busqueda">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-search-icon lucide-search">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
            </svg>
        </button>
        <button class="icon-btn" aria-label="Filtro por región" aria-expanded="false" aria-controls="panel-regiones">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-globe-icon lucide-globe">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                <path d="M2 12h20" />
            </svg>
        </button>
        <button class="icon-btn" aria-label="Filtro de tipos" aria-expanded="false" aria-controls="panel-tipo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-circle-icon lucide-circle">
                <circle cx="12" cy="12" r="10" />
            </svg>
        </button>

    </div>

    <div class="paneles">
        <div id="panel-busqueda" class="panel" hidden>
            <label for="search-input" class="sr-only">Buscar Pokemon por nombre</label>
            <div class="campo-busqueda">
                <input type="search" id="search-input" name="search" placeholder="Buscar Pokemon..." autocomplete="off">
                <button id="btn-limpiar" type="button" aria-label="Limpiar búsqueda" hidden><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-x-icon lucide-x">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg></button>
            </div>
        </div>

        <div id="panel-regiones" class="panel" hidden>
            <fieldset>
                <legend class="sr-only">Filtrar por región</legend>
                <div class="region-opciones"></div>
            </fieldset>
        </div>

        <div id="panel-tipo" class="panel" hidden>
            <fieldset>
                <legend class="sr-only">Filtrar por tipo</legend>
                <div class="tipo-cabecera">
                    <span class="tipo-contador">Tipos seleccionados: 0/2</span>
                    <span class="tipo-aviso" aria-live="polite"></span>
                </div>
                <div class="tipo-opciones"></div>
            </fieldset>
        </div>
    </div>

    <div class="filtros" hidden>
        <fieldset>
            <legend class="sr-only">Filtros actuales activos</legend>
            <div class="filtros-activos"></div>
        </fieldset>
    </div>

    <main>
        <div class="grid">

        </div>
        <div class="empty-state" hidden>
            <p>No se encuentra ningún Pokemon con esa combinación de filtros.</p>
            <button class="delete-filters">Quitar filtros</button>
        </div>
    </main>

    <template id="region-option-template">
        <label class="region-option">
            <input type="radio" name="region" class="sr-only" autocomplete="off">
            <span class="region-nombre"></span>
        </label>
    </template>

    <template id="tipo-option-template">
        <label class="tipo-option">
            <input type="checkbox" name="tipo" class="sr-only" autocomplete="off">
            <span class="tipo-nombre"></span>
        </label>
    </template>

    <template id="filtros-template">
        <span class="chip">
            <span class="chip-texto"></span>
            <button aria-label="Quitar filtro">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </span>
    </template>

    <template id="card-template">
        <article class="card">
            <img src="" alt="" class="card__sprite">
            <span class="card__numero"></span>
            <h3 class="card__nombre"></h3>
            <div class="card__tipos"></div>
        </article>
    </template>

    <footer></footer>
    <script type="module" src="src/js/app.js"></script>
</body>

</html>
